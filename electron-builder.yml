appId: com.devtoolbox.app
productName: 开发者工具箱
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/data
    to: data
    filter:
      - '**/*'
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - ffmpeg.exe
win:
  icon: resources/icon.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: ${productName}-${version}-安装版.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}-${version}-绿色版.${ext}
